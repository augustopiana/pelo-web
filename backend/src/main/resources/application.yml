spring:
  application:
    name: vinilos
  autoconfigure:
    # No usamos el UserDetailsService por defecto (auth es JWT); evita el password autogenerado.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    # Perfil por defecto: dev. En prod se fuerza con SPRING_PROFILES_ACTIVE=prod.
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: false
  servlet:
    multipart:
      # Subida de fotos de vinilos.
      max-file-size: 10MB
      max-request-size: 40MB

# Endpoints de gestion: exponemos solo health (health-check).
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:8080}

app:
  # Origenes permitidos para CORS (los consume CorsConfig).
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # URL del frontend, usada para armar el link de verificacion de email.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  jwt:
    # HS256: el secret debe tener >= 32 bytes. En prod se DEBE pasar JWT_SECRET por entorno.
    secret: ${JWT_SECRET:dev-only-secret-cambiar-en-prod-0123456789-abcdefghijklmnopqrstuvwxyz}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
    verify-ttl: ${JWT_VERIFY_TTL:PT24H}
  mail:
    # 'log' (dev): loguea el link de verificacion. 'smtp' (prod): envia por SMTP real.
    mode: ${APP_MAIL_MODE:log}
    from: ${APP_MAIL_FROM:no-reply@pelo-web.local}
  google:
    # Vacio = login con Google deshabilitado (scaffold). Cargar GOOGLE_CLIENT_ID para activarlo.
    client-id: ${GOOGLE_CLIENT_ID:}
  # Pagos. 'dev' = gateway simulado (checkout local + webhook simulado). 'mercadopago' = MP real.
  payments:
    mode: ${PAYMENTS_MODE:dev}
    # Minutos que un vinilo queda bloqueado mientras el cliente paga (R-11).
    hold-min: ${CHECKOUT_HOLD_MIN:30}
  mp:
    access-token: ${MP_ACCESS_TOKEN:}
    public-key: ${MP_PUBLIC_KEY:}
  # Object storage S3-compatible para las fotos (MinIO en dev). Defaults = compose local.
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}      # lo usa el SDK del backend
    public-url: ${S3_PUBLIC_URL:http://localhost:9000}  # base de la URL que ve el navegador
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:pelo-fotos}
    access-key: ${S3_ACCESS_KEY:peloadmin}
    secret-key: ${S3_SECRET_KEY:pelo-dev-secret}
