# Perfil prod. TODO por variables de entorno: sin credenciales ni defaults sensibles en el repo.
# Variables requeridas: DB_URL, DB_USER, DB_PASSWORD, APP_CORS_ALLOWED_ORIGINS.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  # SMTP real (solo se usa si APP_MAIL_MODE=smtp). Credenciales por entorno.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: info
